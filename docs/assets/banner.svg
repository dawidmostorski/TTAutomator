<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title description">
  <title id="title">TTAutomator</title>
  <desc id="description">Open source desktop control for TikTok on Android. Charcoal canvas, turquoise and pink accents, and a three-phone illustration.</desc>
