<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">TTAutomator — desktop automation for Android</title>
  <desc id="description">TTAutomator wordmark with turquoise and pink T shapes and three connected phones, on a charcoal background.</desc>
  <rect width="1280" height="640" fill="#111115"/>
  <rect x="40" y="40" width="1200" height="560" rx="12" fill="none" stroke="#34343c"/>
